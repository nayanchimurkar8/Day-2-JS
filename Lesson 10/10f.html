
<!DOCTYPE html>
<html>
<head>
  <title>Toggle Button</title>

  <style>
    .toggle-button {
      background-color: rgb(230, 230, 230);
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      margin-right: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .is-toggled {
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>

  <button class="toggle-button">Gaming</button>
  <button class="toggle-button">Music</button>

</body>
</html>
